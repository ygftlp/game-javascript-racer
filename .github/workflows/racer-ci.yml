name: Racer CI

on:
  push:
    branches:
      - codex/modularize-v4-racer
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate production structure
        run: npm run validate:production

      - name: Build WeChat game
        run: npm run build:wx:gamex
